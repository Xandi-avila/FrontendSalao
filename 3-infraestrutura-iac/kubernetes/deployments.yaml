# Deployments e Services do Salão Admin no EKS.
# Cada serviço roda com 2 réplicas no mínimo, espalhadas entre as zonas de disponibilidade.
# As imagens são as mesmas do docker-compose, publicadas num registro (ex.: Amazon ECR).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-salao
  namespace: salao-admin
spec:
  replicas: 2
  selector:
    matchLabels: { app: frontend-salao }
  template:
    metadata:
      labels: { app: frontend-salao }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: frontend-salao }
      containers:
        - name: frontend
          image: salao-admin/frontend-salao:1.0.0
          ports: [{ containerPort: 80 }]
          readinessProbe: { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /health, port: 80 }, initialDelaySeconds: 15, periodSeconds: 20 }
          resources:
            requests: { cpu: "100m", memory: "128Mi" }
            limits:   { cpu: "300m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-salao
  namespace: salao-admin
spec:
  selector: { app: frontend-salao }
  ports: [{ port: 80, targetPort: 80 }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ms-cadastros
  namespace: salao-admin
spec:
  replicas: 2
  selector:
    matchLabels: { app: ms-cadastros }
  template:
    metadata:
      labels: { app: ms-cadastros }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: "/metrics"
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: ms-cadastros }
      containers:
        - name: ms-cadastros
          image: salao-admin/ms-cadastros:1.0.0
          ports: [{ containerPort: 8001 }]
          env: [{ name: PORT, value: "8001" }]
          readinessProbe: { httpGet: { path: /ready, port: 8001 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe:  { httpGet: { path: /health, port: 8001 }, initialDelaySeconds: 10, periodSeconds: 15 }
          resources:
            requests: { cpu: "150m", memory: "192Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
---
apiVersion: v1
kind: Service
metadata:
  name: ms-cadastros
  namespace: salao-admin
spec:
  selector: { app: ms-cadastros }
  ports: [{ port: 8001, targetPort: 8001 }]
---
