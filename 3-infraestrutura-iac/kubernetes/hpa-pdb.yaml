apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ms-agendamentos-hpa
  namespace: salao-admin
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ms-agendamentos
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ms-agendamentos-pdb
  namespace: salao-admin
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ms-agendamentos
