name: Proteger develop

on:
  pull_request_target:
    branches:
      - develop

permissions: {}

jobs:
  validar-origem:
    runs-on: ubuntu-latest
    steps:
      - name: PR para develop deve vir deste repositorio (nao fork externo)
        env:
          HEAD_REPO_FULL_NAME: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPO_FULL_NAME: ${{ github.repository }}
        run: |
          if [ "$HEAD_REPO_FULL_NAME" != "$BASE_REPO_FULL_NAME" ]; then
            echo "Pull requests para develop nao podem vir de fork externo."
            exit 1
          fi
