global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "ms-cadastros"
    static_configs: [{ targets: ["ms-cadastros:8001"] }]
  - job_name: "ms-agendamentos"
    static_configs: [{ targets: ["ms-agendamentos:8002"] }]
  - job_name: "ms-vendas-analise"
    static_configs: [{ targets: ["ms-vendas-analise:8003"] }]
  - job_name: "serverless-notificacoes"
    static_configs: [{ targets: ["serverless-notificacoes:8004"] }]
