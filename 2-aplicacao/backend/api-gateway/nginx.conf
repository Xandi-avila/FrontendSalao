upstream frontend_salao {
    server frontend-salao:80;
}

upstream ms_cadastros {
    server ms-cadastros:8001;
}

upstream ms_agendamentos {
    server ms-agendamentos:8002;
}

upstream ms_vendas_analise {
    server ms-vendas-analise:8003;
}

log_format json_combined escape=json
  '{"timestamp":"$time_iso8601","service":"api-gateway","correlation_id":"$request_id",'
  '"remote_addr":"$remote_addr","method":"$request_method","path":"$uri",'
  '"status_code":$status,"latency_ms":$request_time,"upstream":"$upstream_addr"}';

server {
    listen 80;
    access_log /var/log/nginx/access.log json_combined;

    # Propaga X-Correlation-ID para rastreamento distribuído
    proxy_set_header X-Correlation-ID $request_id;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    location = /health {
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # Microsserviço 1: Autenticação e Cadastros
    location ~ ^/api/(auth|clientes|funcionarios|categorias|produtos|servicos)(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://ms_cadastros;
    }

    # Microsserviço 2: Agenda e Agendamentos
    location ~ ^/api/(agenda|agendamentos)(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://ms_agendamentos;
    }

    # Microsserviço 3: Vendas e Análises
    location ~ ^/api/(vendas|analise)(/.*)?$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://ms_vendas_analise;
    }

    # Frontend Blazor WebAssembly SPA
    location / {
        proxy_pass http://frontend_salao;
    }
}
